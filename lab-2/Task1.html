<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Завдання 1 — Таблиця</title>
        <style>
            table {
                width: 400px;
                height: 400px;
                table-layout: fixed;
                border: 2px solid #111;
                border-collapse: collapse;
            }
            td {
                border: 1px solid #111;
                padding: 0;
            }
        </style>
    </head>
    <body>
        <h1>Завдання 1. Кольорова таблиця</h1>
        <table aria-label="Таблиця з вкладеними кольоровими прямокутниками">
            <tbody>
                <tr style="height: 13%">
                    <td colspan="8" bgcolor="#27e8c7"></td>
                </tr>
                <tr style="height: 13%">
                    <td bgcolor="#fffbd1"></td>
                    <td colspan="6" bgcolor="#27e8c7"></td>
                    <td bgcolor="#fffbd1"></td>
                </tr>
                <tr style="height: 13%">
                    <td bgcolor="#fffbd1"></td>
                    <td bgcolor="#fffbd1"></td>
                    <td colspan="4" bgcolor="#27e8c7"></td>
                    <td bgcolor="#fffbd1"></td>
                    <td bgcolor="#fffbd1"></td>
                </tr>
                <tr style="height: 12.5%">
                    <td bgcolor="#fffbd1"></td>
                    <td bgcolor="#fffbd1"></td>
                    <td bgcolor="#fffbd1"></td>
                    <td bgcolor="#f31323"></td>
                    <td bgcolor="#112cf1"></td>
                    <td bgcolor="#fffbd1"></td>
                    <td bgcolor="#fffbd1"></td>
                    <td bgcolor="#fffbd1"></td>
                </tr>
                <tr style="height: 12.5%">
                    <td bgcolor="#fffbd1"></td>
                    <td bgcolor="#fffbd1"></td>
                    <td bgcolor="#fffbd1"></td>
                    <td bgcolor="#21ed24"></td>
                    <td bgcolor="#fff32b"></td>
                    <td bgcolor="#fffbd1"></td>
                    <td bgcolor="#fffbd1"></td>
                    <td bgcolor="#fffbd1"></td>
                </tr>
                <tr style="height: 12%">
                    <td bgcolor="#fffbd1"></td>
                    <td bgcolor="#fffbd1"></td>
                    <td colspan="4" bgcolor="#27e8c7"></td>
                    <td bgcolor="#fffbd1"></td>
                    <td bgcolor="#fffbd1"></td>
                </tr>
                <tr style="height: 12%">
                    <td bgcolor="#fffbd1"></td>
                    <td colspan="6" bgcolor="#27e8c7"></td>
                    <td bgcolor="#fffbd1"></td>
                </tr>
                <tr style="height: 12%">
                    <td colspan="8" bgcolor="#27e8c7"></td>
                </tr>
            </tbody>
        </table>
        <p><a href="index.html">Повернутись на головну</a></p>
    </body>
</html>
