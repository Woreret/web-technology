<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Завдання 2 — Композиція Мондріана</title>
        <style>
            body {
                text-align: center;
            }
            table {
                width: 500px;
                height: 540px;
                margin: auto;
                table-layout: fixed;
                border: 7px solid #000;
                border-collapse: collapse;
            }
            td {
                border: 7px solid #000;
                padding: 0;
            }
        </style>
    </head>
    <body>
        <h1>Завдання 2. Композиція з червоним, синім і жовтим</h1>
        <table aria-label="Композиція за картиною Піта Мондріана">
            <colgroup>
                <col style="width: 10%" />
                <col style="width: 10%" />
                <col style="width: 20%" />
                <col style="width: 26%" />
                <col style="width: 14%" />
                <col style="width: 20%" />
            </colgroup>
            <tbody>
                <tr style="height: 9%">
                    <td colspan="2" bgcolor="#ffffff"></td>
                    <td colspan="2" bgcolor="#ffffff"></td>
                    <td colspan="2" bgcolor="#fffa69"></td>
                </tr>
                <tr style="height: 26%">
                    <td bgcolor="#ffffff"></td>
                    <td colspan="3" rowspan="2" bgcolor="#ff5b2d"></td>
                    <td colspan="2" bgcolor="#fffa69"></td>
                </tr>
                <tr style="height: 26%">
                    <td bgcolor="#ffffff"></td>
                    <td bgcolor="#ffffff"></td>
                    <td bgcolor="#ffffff"></td>
                </tr>
                <tr style="height: 13%">
                    <td bgcolor="#ffffff"></td>
                    <td colspan="2" rowspan="2" bgcolor="#000000"></td>
                    <td bgcolor="#ffffff"></td>
                    <td colspan="2" bgcolor="#ffffff"></td>
                </tr>
                <tr style="height: 13%">
                    <td rowspan="3" bgcolor="#fffa69"></td>
                    <td bgcolor="#ffffff"></td>
                    <td colspan="2" rowspan="2" bgcolor="#074481"></td>
                </tr>
                <tr style="height: 7%">
                    <td colspan="2" rowspan="2" bgcolor="#ffffff"></td>
                    <td rowspan="2" bgcolor="#000000"></td>
                </tr>
                <tr style="height: 6%">
                    <td colspan="2" bgcolor="#ffffff"></td>
                </tr>
            </tbody>
        </table>
        <p><a href="index.html">Повернутись на головну</a></p>
    </body>
</html>
