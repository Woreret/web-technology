<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 5 - Віджет погоди</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="weather-widget">
        <div class="card-main">
            <div class="nav-arrows">
                <span>&larr;</span>
                <div class="divider"></div>
                <span>&rarr;</span>
            </div>
            <div class="temp">17</div>
        </div>

        <div class="cloud-container">
            <svg class="cloud-svg" viewBox="0 0 280 150" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <radialGradient id="cloudGrad" cx="50%" cy="30%" r="70%">
                        <stop offset="0%" stop-color="#ffffff" />
                        <stop offset="65%" stop-color="#f0f0f0" />
                        <stop offset="100%" stop-color="#d4d4d4" stop-opacity="0.9" />
                    </radialGradient>
                    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="3" />
                    </filter>
                </defs>
                <g filter="url(#softBlur)" opacity="0.95">
                    <ellipse cx="70" cy="95" rx="50" ry="25" fill="#c0c0c0" opacity="0.5" />
                    <ellipse cx="140" cy="100" rx="90" ry="25" fill="#b0b0b0" opacity="0.6" />
                    <circle cx="75" cy="85" r="35" fill="url(#cloudGrad)" />
                    <circle cx="115" cy="65" r="45" fill="url(#cloudGrad)" />
                    <circle cx="165" cy="55" r="50" fill="url(#cloudGrad)" />
                    <circle cx="215" cy="75" r="35" fill="url(#cloudGrad)" />
                    <ellipse cx="150" cy="88" rx="85" ry="30" fill="url(#cloudGrad)" />
                    <ellipse cx="170" cy="50" rx="35" ry="20" fill="#ffffff" opacity="0.8" />
                </g>
            </svg>
        </div>

        <div class="card-forecast">
            <div class="forecast-day">
                <span class="day">Mon</span>
                <span class="forecast-temp">17&deg;</span>
            </div>
            <div class="forecast-day">
                <span class="day">Tue</span>
                <span class="forecast-temp">19&deg;</span>
            </div>
            <div class="forecast-day">
                <span class="day">Wed</span>
                <span class="forecast-temp">16&deg;</span>
            </div>
            <div class="forecast-day">
                <span class="day">Thu</span>
                <span class="forecast-temp">18&deg;</span>
            </div>
            <div class="forecast-day">
                <span class="day">Fri</span>
                <span class="forecast-temp">21&deg;</span>
            </div>
        </div>
    </div>
</body>
</html>
